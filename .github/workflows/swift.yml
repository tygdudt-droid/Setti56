name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (prefer 26)
        id: xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          if [[ "$XC" == *Xcode_26* ]]; then echo "is26=true" >> $GITHUB_OUTPUT; else echo "is26=false" >> $GITHUB_OUTPUT; fi

      - name: Provide fallback AppIcon (Xcode < 26 cannot read .icon files)
        if: steps.xcode.outputs.is26 == 'false'
        run: |
          CATALOG=$(find . -path ./build -prune -o -name "Assets.xcassets" -print | grep -v "Preview" | head -1)
          SET="$CATALOG/AppIcon.appiconset"
          mkdir -p "$SET"
          python3 - "$SET/icon.png" <<'PY'
          import sys, zlib, struct
          w = h = 1024
          row = b'\x00' + bytes([142, 142, 147]) * w          # RGB, no alpha
          raw = row * h
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(raw, 9))
                 + chunk(b'IEND', b''))
          open(sys.argv[1], 'wb').write(png)
          PY
          cat > "$SET/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "icon.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          echo "Fallback icon written to $SET"

      - name: Detect project & scheme
        id: detect
        run: |
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" -json | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "project=$PROJ" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Project: $PROJ  Scheme: $SCHEME"

      - name: Build (no code signing)
        run: |
          EXTRA=""
          if [ "${{ steps.xcode.outputs.is26 }}" = "false" ]; then
            EXTRA="ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon"
          fi
          set -o pipefail
          xcodebuild \
            -project "${{ steps.detect.outputs.project }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            $EXTRA \
            clean build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Settings-iOS-unsigned.ipa" Payload
          ls -lh *.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Settings-iOS-unsigned-ipa
          path: Settings-iOS-unsigned.ipa
