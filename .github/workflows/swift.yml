name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (prefer 26)
        id: xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          if [[ "$XC" == *Xcode_26* ]]; then echo "is26=true" >> $GITHUB_OUTPUT; else echo "is26=false" >> $GITHUB_OUTPUT; fi

      - name: Generate iOS 26 sources (moves old duplicates & Developer files to backup)
        run: |
          test -f generate_ios26.py || { echo "::error::generate_ios26.py missing in repo root"; exit 1; }
          python3 generate_ios26.py --repo .
          rm -rf _ios26_backup

      - name: Auto-wire SettingsStore into the App entry point
        run: |
          python3 - <<'PY'
          import re, glob
          for f in [f for f in glob.glob('Preferences/**/*App.swift', recursive=True)]:
              s = open(f, encoding='utf-8').read()
              if 'SettingsStore.shared' in s: print('already wired:', f); continue
              new = re.sub(r'(ContentView\(\))', r'\1.environment(SettingsStore.shared)', s, count=1)
              open(f, 'w', encoding='utf-8').write(new)
              print('wired:' if new != s else '::warning::ContentView() not found in', f)
          PY

      - name: Fallback AppIcon for Xcode < 26 (.icon files need Xcode 26)
        if: steps.xcode.outputs.is26 == 'false'
        run: |
          SET="Preferences/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$SET"
          python3 - "$SET/icon.png" <<'PY'
          import sys, zlib, struct
          w = h = 1024
          raw = (b'\x00' + bytes([142,142,147])*w) * h
          def chunk(t, d): return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t+d) & 0xffffffff)
          open(sys.argv[1],'wb').write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b''))
          PY
          printf '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$SET/Contents.json"

      - name: Generate a fresh Xcode project from the folder (XcodeGen)
        run: |
          brew install xcodegen
          rm -rf *.xcodeproj
          ICON=$([ "${{ steps.xcode.outputs.is26 }}" = "true" ] && echo SettingsApp || echo AppIcon)
          if [ -f Preferences/Info.plist ]; then
            INFO="INFOPLIST_FILE: Preferences/Info.plist"
          else
            INFO="GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSFaceIDUsageDescription: Settings uses Face ID to unlock hidden apps."
          fi
          cat > project.yml <<YML
          name: Settings-iOS
          options:
            bundleIdPrefix: com.mock
            deploymentTarget:
              iOS: "18.0"
            createIntermediateGroups: true
          targets:
            Preferences:
              type: application
              platform: iOS
              sources:
                - path: Preferences
                  excludes:
                    - "Preview Content/**"
                    - "*.md"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.mock.settings
                  PRODUCT_NAME: Settings
                  MARKETING_VERSION: "26.0"
                  CURRENT_PROJECT_VERSION: "1"
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  ASSETCATALOG_COMPILER_APPICON_NAME: $ICON
                  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
                  DEVELOPMENT_ASSET_PATHS: "Preferences/Preview\ Content"
                  $INFO
          YML
          xcodegen generate
          echo "--- swift files in target: $(grep -c '\.swift in Sources' Settings-iOS.xcodeproj/project.pbxproj)"
          for n in SettingsStore.swift WiFiModels.swift MockDevice.swift AvatarView.swift AboutView.swift; do
            grep -q "$n" Settings-iOS.xcodeproj/project.pbxproj && echo "OK  $n" || { echo "::error::$n not in project"; exit 1; }
          done

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild -project Settings-iOS.xcodeproj -scheme Preferences -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Settings-iOS-unsigned.ipa Payload && ls -lh *.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Settings-iOS-unsigned-ipa
          path: Settings-iOS-unsigned.ipa
