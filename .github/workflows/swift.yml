name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (prefer 26)
        id: xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          if [[ "$XC" == *Xcode_26* ]]; then echo "is26=true" >> $GITHUB_OUTPUT; else echo "is26=false" >> $GITHUB_OUTPUT; fi

      - name: Provide fallback AppIcon (Xcode < 26 cannot read .icon files)
        if: steps.xcode.outputs.is26 == 'false'
        run: |
          CATALOG=$(find . -path ./build -prune -o -name "Assets.xcassets" -print | grep -v "Preview" | head -1)
          SET="$CATALOG/AppIcon.appiconset"
          mkdir -p "$SET"
          python3 - "$SET/icon.png" <<'PY'
          import sys, zlib, struct
          w = h = 1024
          row = b'\x00' + bytes([142, 142, 147]) * w
          raw = row * h
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(raw, 9))
                 + chunk(b'IEND', b''))
          open(sys.argv[1], 'wb').write(png)
          PY
          cat > "$SET/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "icon.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

      - name: Register new Swift files in the Xcode project
        run: |
          sudo gem install xcodeproj --no-document -q
          ruby - <<'RUBY'
          require 'xcodeproj'
          require 'pathname'

          proj_path = Dir['*.xcodeproj'].first or abort 'no .xcodeproj found'
          project   = Xcodeproj::Project.open(proj_path)
          target    = project.targets.find { |t| t.product_type == 'com.apple.product-type.application' } or abort 'no app target'
          root      = Pathname.new(Dir.pwd)

          if project.main_group.children.any? { |c| c.isa == 'PBXFileSystemSynchronizedRootGroup' }
            puts 'project uses synchronized folders - nothing to register'
            exit 0
          end

          phase = target.source_build_phase

          # 1) drop references to Swift files that no longer exist on disk (e.g. deleted Developer views)
          phase.files.dup.each do |bf|
            ref  = bf.file_ref or next
            path = (ref.real_path rescue nil) or next
            next if path.exist?
            puts "- removed missing reference: #{path.relative_path_from(root)}"
            phase.remove_build_file(bf)
            ref.remove_from_project
          end

          # 2) find the app source folder (the one containing *App.swift)
          app_file = Dir.glob('**/*App.swift').reject { |f| f.start_with?('build/', '_ios26_backup/') }.first or abort 'no *App.swift'
          src_dir  = File.dirname(app_file)
          puts "source folder: #{src_dir}"

          existing = phase.files.map { |bf| (bf.file_ref.real_path.to_s rescue nil) }.compact
          group    = project.main_group.find_subpath('iOS26 Generated', true)

          added = 0
          Dir.glob("#{src_dir}/**/*.swift").sort.each do |rel|
            next if rel.include?('Preview Content')
            abs = (root + rel).to_s
            next if existing.include?(abs)
            ref = group.new_reference(abs)
            target.add_file_references([ref])
            puts "+ added: #{rel}"
            added += 1
          end

          # 3) warn about duplicate basenames (would cause 'invalid redeclaration')
          names = phase.files.map { |bf| bf.file_ref&.path.to_s.split('/').last }.compact
          names.group_by { |n| n }.select { |_, v| v.size > 1 }.each_key { |n| puts "!! DUPLICATE in target: #{n}" }

          project.save
          puts "registered #{added} new files"
          RUBY

      - name: Detect project & scheme
        id: detect
        run: |
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" -json | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "project=$PROJ" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

      - name: Build (no code signing)
        run: |
          EXTRA=""
          [ "${{ steps.xcode.outputs.is26 }}" = "false" ] && EXTRA="ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon"
          set -o pipefail
          xcodebuild \
            -project "${{ steps.detect.outputs.project }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            $EXTRA \
            clean build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry "Settings-iOS-unsigned.ipa" Payload
          ls -lh *.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Settings-iOS-unsigned-ipa
          path: Settings-iOS-unsigned.ipa
