name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "Xcode 26 not found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Provide AppIcon
        run: |
          CATALOG=$(find Preferences -name "Assets.xcassets" -not -path "*Preview*" | head -1)
          SET="$CATALOG/AppIcon.appiconset"
          mkdir -p "$SET"
          if [ -f AppIcon.png ]; then
            sips -s format png -z 1024 1024 AppIcon.png --out "$SET/icon.png" >/dev/null
          else
            cat > /tmp/icon.swift <<'SWIFT'
          import AppKit
          let out = CommandLine.arguments[1]
          let rep = NSBitmapImageRep(bitmapDataPlanes: nil, pixelsWide: 1024, pixelsHigh: 1024, bitsPerSample: 8,
                                     samplesPerPixel: 4, hasAlpha: true, isPlanar: false, colorSpaceName: .deviceRGB,
                                     bytesPerRow: 0, bitsPerPixel: 0)!
          rep.size = NSSize(width: 1024, height: 1024)
          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
          let full = NSRect(x: 0, y: 0, width: 1024, height: 1024)
          NSGradient(starting: NSColor(calibratedWhite: 0.66, alpha: 1), ending: NSColor(calibratedWhite: 0.40, alpha: 1))!.draw(in: full, angle: -90)
          if let sym = NSImage(systemSymbolName: "gearshape.fill", accessibilityDescription: nil)?
                .withSymbolConfiguration(NSImage.SymbolConfiguration(pointSize: 640, weight: .regular)) {
              let s = sym.size
              let tinted = NSImage(size: s)
              tinted.lockFocus()
              sym.draw(in: NSRect(origin: .zero, size: s))
              NSColor.white.set()
              NSRect(origin: .zero, size: s).fill(using: .sourceAtop)
              tinted.unlockFocus()
              tinted.draw(in: NSRect(x: (1024 - s.width) / 2, y: (1024 - s.height) / 2, width: s.width, height: s.height))
          }
          NSGraphicsContext.restoreGraphicsState()
          try! rep.representation(using: .png, properties: [:])!.write(to: URL(fileURLWithPath: out))
          SWIFT
            swift /tmp/icon.swift "$SET/icon.png" || python3 - "$SET/icon.png" <<'PY'
          import sys, zlib, struct
          w = h = 1024
          raw = (b'\x00' + bytes([142,142,147])*w) * h
          def chunk(t, d): return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t+d) & 0xffffffff)
          open(sys.argv[1],'wb').write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b''))
          PY
          fi
          printf '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$SET/Contents.json"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          rm -rf *.xcodeproj
          python3 - <<'PY'
          import os
          settings = {
              "PRODUCT_BUNDLE_IDENTIFIER": "com.mock.settings",
              "PRODUCT_NAME": "Settings",
              "MARKETING_VERSION": "26.0",
              "CURRENT_PROJECT_VERSION": "1",
              "SWIFT_VERSION": "5.0",
              "TARGETED_DEVICE_FAMILY": "1,2",
              "ASSETCATALOG_COMPILER_APPICON_NAME": "AppIcon",
              "ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME": "AccentColor",
              "STRING_CATALOG_GENERATE_SYMBOLS": "YES",
              "SWIFT_COMPILATION_MODE": "wholemodule",
              "GENERATE_INFOPLIST_FILE": "YES",
              "INFOPLIST_KEY_CFBundleDisplayName": "Settings",
              "INFOPLIST_KEY_UILaunchScreen_Generation": "YES",
              "INFOPLIST_KEY_UIApplicationSceneManifest_Generation": "YES",
              "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents": "YES",
              "INFOPLIST_KEY_UISupportedInterfaceOrientations": "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight",
              "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight",
              "INFOPLIST_KEY_NSFaceIDUsageDescription": "Settings uses Face ID to unlock hidden apps and show Wi-Fi passwords.",
          }
          if os.path.exists("Preferences/Info.plist"):
              settings["INFOPLIST_FILE"] = "Preferences/Info.plist"
          lines = [
              "name: Settings-iOS",
              "options:",
              "  bundleIdPrefix: com.mock",
              "  deploymentTarget:",
              '    iOS: "26.0"',
              "  createIntermediateGroups: true",
              "targets:",
              "  Preferences:",
              "    type: application",
              "    platform: iOS",
              "    sources:",
              "      - path: Preferences",
              "        excludes:",
              '          - "Preview Content/**"',
              '          - "*.md"',
              '          - "**/*.icon"',
              '          - "Info.plist"',
              "    settings:",
              "      base:",
          ]
          for k, v in settings.items():
              lines.append(f'        {k}: "{v}"')
          open("project.yml", "w").write("\n".join(lines) + "\n")
          PY
          xcodegen generate
          PBX=Settings-iOS.xcodeproj/project.pbxproj
          echo "swift files on disk  : $(find Preferences -name '*.swift' -not -path '*Preview*' | wc -l | tr -d ' ')"
          echo "swift files in target: $(grep -c '\.swift in Sources' $PBX)"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Settings-iOS.xcodeproj -scheme Preferences -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Verify and repair bundle
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          PL="$APP/Info.plist"
          PB=/usr/libexec/PlistBuddy
          set_if_missing() { $PB -c "Print :$1" "$PL" >/dev/null 2>&1 || $PB -c "Add :$1 $2 $3" "$PL"; }
          set_if_missing CFBundleIdentifier string com.mock.settings
          set_if_missing CFBundleDisplayName string Settings
          set_if_missing CFBundleShortVersionString string 26.0
          set_if_missing CFBundleVersion string 1
          set_if_missing MinimumOSVersion string 26.0
          if ! $PB -c "Print :CFBundleIcons" "$PL" >/dev/null 2>&1 && ls "$APP" | grep -q '^AppIcon60x60@2x\.png$'; then
            $PB -c "Add :CFBundleIcons dict" -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" \
                -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" \
                -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" \
                -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$PL"
          fi
          plutil -p "$PL" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleIcons" || true
          test -f "$APP/Assets.car" || { echo "Assets.car missing"; exit 1; }

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry Settings-iOS-unsigned.ipa Payload && ls -lh *.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Settings-iOS-unsigned-ipa
          path: Settings-iOS-unsigned.ipa

